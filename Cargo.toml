[package]
name = "xslice"
version = "0.1.1"
edition = "2024"
repository = "https://github.com/demurgos/xslice"
license = "AGPL-3.0-or-later"
description = "Slice representation using relative extents instead of absolute pointers"

[dependencies]
reborrow05 = { package = "reborrow", version = "0.5.5", default-features = false, optional = true }

[features]
reborrow05 = ["dep:reborrow05"]
